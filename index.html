/* Layout: navy-and-gold masthead (crest, title, tagline, sign-up pill) over a results feed beside a mini-table; colours and lettering follow the society's logo and posters */
:root{
  --navy:#04215A; --navy-hi:#0D3579; --navy-lo:#011438;
  --gold:#E2AE47; --gold-hi:#F8DA80; --gold-lo:#B98228; --gold-line:rgba(226,174,71,.45);
  --band-ink:#FFFFFF; --band-muted:#AFBCDB;
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#EAEEF6; --ink:#0A1B44; --muted:#57638A; --line:#DCE2EE;
  --gold-text:#8C6312; --link:#173A8F;
  --pri-bg:#04215A; --pri-ink:#FFFFFF;
  --score-bg:#04215A; --score-ink:#FFFFFF;
  --tag-bg:#E6EBF5; --tag-ink:#3E4B72; --flag-edge:rgba(10,27,68,.16);
  --win:#1E8A55; --draw:#7D879F; --loss:#C23B36; --loss-ink:#B42F2A; --on-sem:#FFFFFF; --here-bg:#E3F3E9; --here-ink:#17683F;
  --display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --r:12px;
}

  --navy-lo:#010F2E; color-scheme:dark}}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{box-sizing:border-box;width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html,body{height:100%}
#root{min-height:100%;display:flex;flex-direction:column}
#root>main{flex:1 0 auto}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.band :focus-visible,.site-foot :focus-visible{outline-color:var(--gold)}

/* masthead */
.band{background:radial-gradient(120% 170% at 12% 0%,var(--navy-hi) 0%,var(--navy) 46%,var(--navy-lo) 100%);color:var(--band-ink);position:relative;overflow:hidden;border-bottom:1px solid var(--gold-line)}
.band::before,.band::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.band::before{width:520px;height:520px;right:-230px;top:-260px;border:1.5px solid rgba(226,174,71,.30)}
.band::after{width:380px;height:380px;right:-170px;top:-195px;border:1.5px solid rgba(255,255,255,.10)}
.band .wrap{position:relative;z-index:1;padding-block:26px 0}

.crest.sm{width:46px;height:46px;box-shadow:none}
.brand{min-width:0}
.kick{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--band-muted)}
.kick::before{content:"";width:28px;height:1px;background:var(--gold);flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.4vw,50px);line-height:1.02;margin:6px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.gold{background:linear-gradient(180deg,var(--gold-hi) 8%,var(--gold) 55%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.tagline{margin-top:9px;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--band-ink)}
.tagline i{font-style:normal;color:var(--gold);margin:0 .5em 0 .2em}
.cta{display:inline-flex;align-items:center;gap:12px;padding:9px 20px 9px 14px;border:1.5px solid var(--gold);border-radius:999px;color:var(--band-ink);text-decoration:none;background:rgba(1,20,56,.35)}
.cta:hover{background:rgba(226,174,71,.14)}
.cta svg{flex:none;color:var(--gold)}
.cta .div{width:1px;align-self:stretch;background:var(--gold-line)}
.cta .k{display:block;font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.cta .v{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
@media (max-width:700px){
  .mast{grid-template-columns:auto minmax(0,1fr)}
  .cta{grid-column:1/-1;justify-self:start}
  .crest{width:68px;height:68px}
  .kick{font-size:10px;letter-spacing:.18em;gap:8px}
  .kick::before{width:16px}
  .tagline{font-size:9.5px;letter-spacing:.16em}
}
nav.tabs{display:flex;gap:2px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--band-muted);text-decoration:none;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px 13px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--band-ink)}
nav.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--gold)}

/* page */
main.wrap{padding-block:26px 56px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.08em;line-height:1.2;margin:0;text-wrap:balance}
h2.big{font-size:clamp(22px,4vw,32px);letter-spacing:.02em}
.sub-h{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:13.5px;letter-spacing:.1em;margin:24px 0 10px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
a.more{color:var(--link);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-decoration:none}
a.more:hover{text-decoration:underline}
a.back{display:inline-block;margin-bottom:14px;font-weight:700;font-size:13px;letter-spacing:.04em;text-decoration:none}
.empty{padding:20px 16px;margin:0;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.note{padding:10px 14px;border-radius:10px;border:1px dashed var(--muted);color:var(--muted);font-size:13.5px;display:flex;gap:8px 14px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* season stages, as on the launch poster */
.stages{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);align-items:center;gap:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stage{display:flex;gap:14px;align-items:flex-start;min-width:0}
.stage .num{flex:none;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--gold);display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--gold-text)}
.stage.now .num{background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:none;color:var(--navy)}
.stage .k{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-text)}
.stage .t{font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.04em;line-height:1.2;margin-top:2px}
.stage p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.stages .arrow{position:relative;height:2px;background:var(--gold);margin-right:6px}
.stages .arrow::after{content:"";position:absolute;right:-7px;top:-5px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid var(--gold)}
@media (max-width:640px){.stages{grid-template-columns:minmax(0,1fr)}.stages .arrow{display:none}}

/* next event */
.event{border-color:var(--gold-line)}
.ev-head{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;padding:18px;background:radial-gradient(130% 170% at 0% 0%,var(--navy-hi) 0%,var(--navy) 55%,var(--navy-lo) 100%);color:var(--band-ink)}
.ev-head::after{content:"";position:absolute;right:-70px;top:-110px;width:260px;height:260px;border-radius:50%;border:1.5px solid rgba(226,174,71,.28);pointer-events:none}
.ev-date{position:relative;z-index:1;flex:none;width:74px;padding:8px 0 10px;border:1.5px solid var(--gold);border-radius:12px;display:flex;flex-direction:column;align-items:center;line-height:1.1;background:rgba(1,20,56,.35)}
.ev-date span{font-size:10.5px;font-weight:700;letter-spacing:.18em;padding-left:.18em;text-transform:uppercase;color:var(--band-muted)}
.ev-date b{font-size:34px;font-weight:800;line-height:1.08;background:linear-gradient(180deg,var(--gold-hi) 8%,var(--gold) 55%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ev-info{position:relative;z-index:1;min-width:0}
.ev-kick{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.ev-head h2{font-size:clamp(20px,3.4vw,28px);letter-spacing:.03em;margin-top:4px}
.ev-meta{display:flex;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--band-muted)}
.ev-meta span+span::before{content:"·";margin:0 8px;color:var(--gold)}
.ev-note{margin:8px 0 0;font-size:13px}
.ev-body{display:flex;flex-direction:column;gap:10px;padding:14px 18px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
a.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:inherit;text-decoration:none;font-weight:700;font-size:13.5px}
a.chip:hover{border-color:var(--gold)}
.ev-empty{margin:0;padding:12px 18px 16px;border-top:1px dashed var(--line);color:var(--muted);font-size:13.5px}
.ev-fx{border-top:1px solid var(--line)}
@media (max-width:520px){.ev-head{gap:14px;padding:16px}.ev-date{width:64px}.ev-date b{font-size:28px}.ev-meta{flex-direction:column;gap:2px}.ev-meta span+span::before{content:none}}

/* fixtures */
.day{padding:8px 16px;background:var(--sunk);font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
a.fx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px 14px;padding:13px 16px 11px;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.day + a.fx{border-top:0}
a.fx:hover{background:var(--sunk)}
.fx .t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;min-width:0}
.fx .t.home{justify-content:flex-end;text-align:right}
.fx .meta{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.nm .code{display:none}
@media (max-width:520px){.nm .full{display:none}.nm .code{display:inline}}
.score{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;background:var(--score-bg);color:var(--score-ink);border-radius:8px;padding:3px 10px 4px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 -2px 0 var(--gold)}
.score .dash{opacity:.5;margin:0 4px}
.score.ko{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;padding:4px 10px}
.flag{display:inline-block;flex:none;width:24px;height:16px;border-radius:3px;object-fit:cover;vertical-align:middle;outline:1px solid var(--flag-edge);outline-offset:-1px}
.flag.md{width:36px;height:24px;border-radius:4px}
.flag.lg{width:66px;height:44px;border-radius:6px}
.flag.none{background:var(--navy);color:var(--gold);overflow:hidden}
.flag.none svg{display:block;width:100%;height:100%}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink)}
.tag.wc{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--navy)}
.tag.ex{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted)}

/* tables */
.tw{overflow-x:auto}
table.lg{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lg th{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.lg td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:500}
.lg tr:last-child td{border-bottom:0}
.lg .l{text-align:left}
.lg th:first-child,.lg td:first-child{padding-left:16px}
.lg th:last-child,.lg td:last-child{padding-right:16px}
.lg .pos{font-weight:800;font-size:15px;width:28px;text-align:left;color:var(--muted)}
.lg tr.top .pos{color:var(--gold-text)}
.lg .team{display:flex;align-items:center;gap:10px;font-weight:700}
.lg .team a{color:inherit;text-decoration:none}
.lg .team a:hover{text-decoration:underline}
.lg .pts{font-weight:800;font-size:15px}
.lg .mute{color:var(--muted)}
.foot{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:19px;height:19px;border-radius:50%;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;color:var(--on-sem)}
.form i.W{background:var(--win)}.form i.D{background:var(--draw)}.form i.L{background:var(--loss)}

/* match page */
.hero{padding:18px 16px 24px}
.hero .top{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;text-align:center}
.hero .row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;margin-top:18px}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.hero .side a{font-family:var(--display);font-weight:800;font-size:clamp(15px,2.8vw,22px);letter-spacing:.04em;text-transform:uppercase;color:inherit;text-decoration:none;line-height:1.15}
.hero .score{font-size:clamp(32px,7vw,50px);padding:4px 18px 6px;border-radius:12px;box-shadow:inset 0 -3px 0 var(--gold)}
.hero .score.ko{font-size:22px;box-shadow:inset 0 0 0 1.5px var(--line)}
.scorers{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;margin-top:14px;font-size:13px;color:var(--muted)}
.scorers .h{text-align:right}.scorers .mid{width:72px}
.culture{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);margin:0}
.culture div{background:var(--surface);padding:12px 16px}
.culture dt{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text);font-weight:700}
.culture dd{margin:3px 0 0;font-weight:600}
ol.tl{list-style:none;margin:0;padding:6px 0}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;gap:10px;padding:7px 16px}
.tl .h{text-align:right}
.tl .mn{justify-self:center;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:20px;padding:2px 10px;font-size:12.5px;white-space:nowrap}
.tl .gn{font-weight:700}
.tl .as{display:block;font-size:12px;color:var(--muted)}
.tl .rs{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.sheets{display:grid;grid-template-columns:1fr 1fr}
.sheet{padding:14px 16px 18px;min-width:0}
.sheet + .sheet{border-left:1px solid var(--line)}
@media (max-width:600px){.sheets{grid-template-columns:1fr}.sheet + .sheet{border-left:0;border-top:1px solid var(--line)}}
.sheet h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.sheet .lbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text);font-weight:700;margin:12px 0 4px}
.sheet ul{list-style:none;margin:0;padding:0}
.sheet li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sheet li:last-child{border-bottom:0}
.bs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.b.motm{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--navy)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
ol.lb{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:24px 24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb .rk{font-weight:800;font-size:14px;color:var(--muted)}
.lb li:first-child .rk{color:var(--gold-text)}
.lb .who{min-width:0}
.lb .n{display:block;font-weight:700}
.lb .s{display:block;font-size:12px;color:var(--muted)}
.lb .v{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}

/* societies */
.socs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
a.soc{display:flex;gap:14px;align-items:center;padding:16px;color:inherit;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
a.soc:hover{border-color:var(--gold)}
a.soc .n{font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
a.soc .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.sh{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 16px}
.sh .grow1{flex:1;min-width:200px}
.sh .eyebrow{margin-top:6px}
a.nx{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--gold-text);text-decoration:none}
a.nx:hover{text-decoration:underline}

/* admin */
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:13px;letter-spacing:.03em;border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri-bg);color:var(--pri-ink);border-color:var(--pri-bg)}
.btn.danger{color:var(--loss-ink)}
.btn.warn{background:var(--loss);border-color:var(--loss-ink);color:var(--on-sem)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
ul.adm{list-style:none;margin:0;padding:0}
.adm li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.adm li:first-child{border-top:0}
.adm .what{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ed{padding:16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .span2{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.ed label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.ed input,.ed select,.ed textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;box-sizing:border-box}

.ed input[type=checkbox]{width:auto;padding:0;margin:0;accent-color:var(--pri-bg)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.ed label.ck{flex-direction:row;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer}

.fpick{display:flex;gap:10px;align-items:center}
.fpick select{flex:1}
.grow{display:grid;grid-template-columns:120px minmax(0,1.4fr) 78px minmax(0,1.2fr) auto auto;gap:10px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--line)}
@media (max-width:760px){.grow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.sub-row .sub-h{margin:0}
.err{color:var(--loss-ink);font-weight:600;min-height:1.4em;margin:14px 0 6px}

/* footer */
.site-foot{background:var(--navy-lo);color:var(--band-muted);border-top:1px solid var(--gold-line)}
.site-foot .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* shared bits for squads */
.grow1{flex:1;min-width:0}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.pri:hover{filter:brightness(1.08)}
button.back{font:inherit;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--link);background:none;border:0;padding:0;margin-bottom:14px;cursor:pointer}

.b.cap{background:var(--gold);color:var(--navy)}
.pps{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}

.reg{border-color:var(--gold-line)}

.linkbox{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--muted);border-radius:10px}
.linkbox>div{min-width:0}
.linkbox code{display:block;margin-top:3px;font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);word-break:break-all}
.ed textarea#imp-text{min-height:110px}
.imp-wrap{gap:12px}
.imp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.imp-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:12px 14px;background:var(--sunk)}
.imp-h b{font-size:14.5px;color:var(--ink)}
.imp ul{list-style:none;margin:0;padding:0}
.imp li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}
.imp .imp-x{margin:0;padding:10px 14px;border-top:1px solid var(--line)}
.ed .imp label.chk{align-self:auto;padding:10px 14px;border-top:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px}
.imp-err{padding:12px 14px;color:var(--loss-ink);font-weight:600}
.tag.new{background:var(--here-bg);color:var(--here-ink)}
.tag.upd{background:var(--gold);color:var(--navy)}

/* matchday */
.md-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
button.md-team{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
button.md-team:hover{border-color:var(--gold)}
button.md-team:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.md-tn{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.md-tn b{font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.md-meta{font-size:12.5px;color:var(--muted)}
.md-stat{flex:none;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink);white-space:nowrap}
.md-stat.ok{background:var(--here-bg);color:var(--here-ink)}
.md-stat.warn{background:var(--gold);color:var(--navy)}
.md-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px}
.md-head h2{font-size:clamp(19px,4.4vw,28px);letter-spacing:.02em}
.md-count{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.md-count b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.md-count .hint{margin:0}
.md-tip{margin:0;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
ul.ci-list{list-style:none;margin:0;padding:0}
.ci-list li{display:flex;align-items:stretch;border-top:1px solid var(--line)}
button.ci{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:10px 16px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.ci:focus-visible{outline:2px solid var(--link);outline-offset:-3px}
.ci-list li.on{background:var(--here-bg)}
.ci-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.ci-nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:18px;font-weight:700;line-height:1.25}
.ci-sub{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.ci-tick{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px}
.ci-tick i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);color:transparent;box-sizing:border-box}
button.ci[aria-pressed="true"] .ci-tick i{background:var(--win);border-color:var(--win);color:var(--on-sem)}
.ci-time{min-height:14px;font-size:11px;font-weight:700;color:var(--here-ink);font-variant-numeric:tabular-nums}
.ci-list .linkbtn{flex:none;padding:0 16px}
@media (max-width:420px){.ed label.pchip,label.pchip{min-width:0;height:36px;padding:0 10px;font-size:12px}.pl-tags{gap:6px}}
.md-add{border-top:1px solid var(--line)}
.md-foot{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line)}
.md-foot .hint{margin:0}
.md-bar{position:sticky;bottom:0;z-index:5;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.md-bar-in{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 -6px 24px rgba(1,20,56,.18)}
.md-st{font-size:13px;color:var(--muted);min-width:0;flex:1 1 220px}
.md-st b{color:var(--ink)}
.mini{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mini select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.pad{margin:0;padding:12px 16px 16px}
.lu-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.lu-col .btn{align-self:flex-start}

/* phones: no input zoom, bigger tap targets, scroll hint on tabs */
.toast{pointer-events:none}
body:has(.md-bar) .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.lg .team a,a.more{display:inline-block;padding:8px 0;margin:-8px 0}
.kpi .s a{display:inline-block;padding:6px 0;margin:-6px 0}
.hero .side a{padding:6px 0;margin:-6px 0}
.site-foot a{display:inline-block;padding:6px 0}
a.back,button.back{padding:8px 0;margin:-8px 0 6px}
details.raw summary{padding:8px 0}
.tw:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
nav.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)}
@media (max-width:760px),(pointer:coarse){.ed input,.ed select,.ed textarea,.mini select,details.raw textarea{font-size:16px}}

/* standalone site */
.tab-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--navy);font-size:10.5px;letter-spacing:0;vertical-align:1px;box-sizing:border-box}
.site-foot .foot-btn{font:inherit;font-size:13px;font-weight:600;color:var(--gold);background:none;border:0;padding:6px 0;cursor:pointer}
.site-foot .foot-btn:hover{text-decoration:underline}
.site-note{margin:0 0 20px}
.imp-acts{padding:10px 14px;border-top:1px solid var(--line)}
ul.adm.boxed{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fpick input{flex:1}
</style>
<script src="config.js"></script>
</head>

(function(){

var SEED=JSON.parse(document.getElementById('seed').textContent),S=null,SERVER=null,FB=null,USER=null,LOADED=false,NOTICE='',PENDING=[],ADMINS=null,ADM_LOADING=false,INRM={},NEWIDS={},pendingRender=false;
var CAN=false,LOCAL=false,ED=null,SED=null,EVD=null,BUSY=false,PEND=null,REG=null,IMP=null;

var COMPS=['Friendly','Exhibition','World Cup · Group','World Cup · Knockout','World Cup · Final'];
var POS=['GK','DEF','MID','ATT'],POSN={GK:'Goalkeeper',DEF:'Defender',MID:'Midfielder',ATT:'Attacker'},NEED=7,MAXP=15,REG_KEY='icwc-reg-v1';

/* ---------- storage (per-viewer conveniences only) ---------- */
function store(t){try{return t==='s'?window.sessionStorage:window.localStorage}catch(e){return null}}
function sGet(t,k){try{var st=store(t),v=st&&st.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function sSet(t,k,v){try{var st=store(t);if(st)st.setItem(k,JSON.stringify(v))}catch(e){}}
function sDel(t,k){try{var st=store(t);if(st)st.removeItem(k)}catch(e){}}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function soc(id){return S.societies.find(function(s){return s.id===id})||{id:id,name:'Unknown',full:'Unknown society',code:'???',flag:''}}
var FLAGS=JSON.parse(document.getElementById('flags').textContent),FURI={};
var XNAMES={'gb-eng':'England','gb-sct':'Scotland','gb-wls':'Wales','gb-nir':'Northern Ireland'};
var DN=null;try{DN=new Intl.DisplayNames(['en-GB'],{type:'region'})}catch(e){}
function okFlag(c){return !!c&&c.charAt(0)!=='_'&&has(FLAGS,c)}
function cname(c){if(has(XNAMES,c))return XNAMES[c];var u=c.toUpperCase();try{var n=DN&&DN.of(u);if(n&&n!==u)return n}catch(e){}return u}
var FOPTS=null;
function flagOpts(){return FOPTS||(FOPTS=Object.keys(FLAGS).filter(okFlag).map(function(c){return [c,cname(c)]}).sort(function(a,b){return a[1].localeCompare(b[1])}))}
var GLOBE='<svg viewBox="0 0 24 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.15"><circle cx="12" cy="8" r="5.3"/><ellipse cx="12" cy="8" rx="2.3" ry="5.3"/><path d="M6.7 8h10.6"/></g></svg>';
function flag(s,size){
  var c=s&&s.flag,cls='flag'+(size?' '+size:'');
  if(okFlag(c)){if(!FURI[c])FURI[c]='data:image/svg+xml,'+encodeURIComponent(FLAGS[c]);return '<img class="'+cls+'" src="'+FURI[c]+'" alt="" width="24" height="16">'}
  return '<span class="'+cls+' none" aria-hidden="true">'+GLOBE+'</span>';
}
function pad(n){return (n<10?'0':'')+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hhmm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function events(){return S.events||(S.events=[])}
function evById(id){return events().find(function(e){return e.id===id})}
function evOn(d){return events().find(function(e){return e.date===d})}
function nextEvent(){var t=todayStr();return events().filter(function(e){return e.date>=t}).sort(function(a,b){return a.date.localeCompare(b.date)})[0]||null}
function evSocs(e){return (e.societies||[]).map(function(id){return S.societies.find(function(s){return s.id===id})}).filter(Boolean)}
function countdown(d){var n=Math.round((new Date(d+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/864e5);return n<0?'Finished':n===0?'Today':n===1?'Tomorrow':'In '+n+' days'}
function fmtD(d){var x=new Date(d+'T12:00:00');return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function fmtShort(d){var x=new Date(d+'T12:00:00');return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function byDate(a,b){return (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))}
function score(m){var h=0,a=0;(m.goals||[]).forEach(function(g){if(g.side==='home')h++;else a++});return [h,a]}
function played(){return S.matches.filter(function(m){return m.status==='played'}).sort(byDate)}
function upcoming(){return S.matches.filter(function(m){return m.status!=='played'}).sort(byDate)}
function sideSoc(m,s){return s==='home'?m.home:m.away}
function other(s){return s==='home'?'away':'home'}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hasEx(){return S.matches.some(function(m){return m.example})}
function mVenue(m){var e=evOn(m.date);return m.venue||(e&&e.venue)||'Venue TBC'}
function compTag(m){var wc=/^World Cup/.test(m.comp||'');return '<span class="tag'+(wc?' wc':'')+'">'+esc(m.comp||'Friendly')+'</span>'+(m.example?' <span class="tag ex">Example</span>':'')}

/* names and positions */
function clean(s,max){return String(s==null?'':s).replace(/[\u0000-\u001f\u007f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,max||40)}
function nk(s){var t=clean(s,120);try{t=t.normalize('NFD')}catch(e){}return t.replace(/[̀-ͯ]/g,'').toLowerCase()}
function full(p){return (clean(p.first)+' '+clean(p.last)).trim()}
function posSort(a){a=Array.isArray(a)?a:[];return POS.filter(function(x){return a.indexOf(x)>=0})}
function posRank(a){for(var i=0;i<POS.length;i++)if(a&&a.indexOf(POS[i])>=0)return i;return 9}
function mask(a){var m=0;POS.forEach(function(x,i){if(a.indexOf(x)>=0)m|=1<<i});return m}
function unmask(m){return POS.filter(function(x,i){return m&(1<<i)})}
function ppills(a){a=posSort(a);return a.length?'<span class="pps">'+a.map(function(x){return '<span class="pp" title="'+POSN[x]+'">'+x+'</span>'}).join('')+'</span>':'<span class="mute">–</span>'}
function slots(n){var h='';for(var i=0;i<NEED;i++)h+='<i'+(i<n?' class="on"':'')+'></i>';return '<span class="slots" aria-hidden="true">'+h+'</span>'}
function b64e(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}

/* squads: S.squads[eventId][societyId] = {players:[{id,first,last,pos,cap?,sub?,rep?}], here:{playerId:'14:05'}, at, done} */
function squads(){return S.squads||(S.squads={})}
function squad(eid,sid){var a=squads()[eid];return a&&a[sid]||null}
function ensureSquad(eid,sid){var all=squads(),a=all[eid]||(all[eid]={});return a[sid]||(a[sid]={players:[],here:{}})}
function sqCount(eid,sid){var q=squad(eid,sid);return q?q.players.length:0}
function hereCount(q){return q?q.players.filter(function(p){return q.here&&q.here[p.id]}).length:0}
function regOpen(e){return !e.close||todayStr()<=e.close}
function findSocByName(name){var k=nk(String(name||'').replace(/\s+society$/i,''));if(!k)return null;return S.societies.find(function(s){return nk(s.name)===k||nk(String(s.full||'').replace(/\s+society$/i,''))===k})||null}
function createSociety(name,id){
  var short=clean(String(name).replace(/\s+society$/i,''),30)||clean(name,30)||'New';
  var base=nk(short).replace(/[^a-z]/g,'').toUpperCase().slice(0,3);if(base.length<2)base='SOC';
  var code=base,i=0;while(S.societies.some(function(s){return s.code===code})&&i<26)code=base.slice(0,3)+String.fromCharCode(65+(i++));
  var s={id:id,name:short,full:short+' Society',code:code,flag:''};S.societies.push(s);return s;
}
/* mode: 'none' keeps players missing from the list, 'soft' drops them unless they were checked in or added on the day, 'hard' keeps exactly the list */
function applySquad(eid,sid,ps,mode){
  var q=ensureSquad(eid,sid),old=q.players||[],byId={},byKey={},used={},out=[],anyCap=ps.some(function(p){return p.cap});
  old.forEach(function(p){byId[p.id]=p;byKey[nk(full(p))]=p});
  ps.forEach(function(np){
    var o=(np.id&&byId[np.id])||byKey[nk(full(np))];
    if(o&&used[o.id])o=null;
    if(o){used[o.id]=1;o.first=np.first;o.last=np.last;o.pos=posSort(np.pos);if(anyCap||mode==='hard'){if(np.cap)o.cap=true;else delete o.cap}out.push(o)}
    else{o={id:uid('p'),first:np.first,last:np.last,pos:posSort(np.pos)};if(np.cap)o.cap=true;out.push(o)}
  });
  old.forEach(function(p){if(used[p.id])return;var keep=mode==='none'||(mode==='soft'&&(p.sub||(q.here&&q.here[p.id])));if(keep){if(anyCap)delete p.cap;out.push(p)}});
  q.players=out;q.here=q.here||{};
  Object.keys(q.here).forEach(function(k){if(!out.some(function(p){return p.id===k}))delete q.here[k]});
  if(!q.at)q.at=todayStr();
  var e=evById(eid);if(e){e.societies=e.societies||[];if(e.societies.indexOf(sid)<0)e.societies.push(sid)}
  return q;
}

function table(){
  var T={};S.societies.forEach(function(s){T[s.id]={s:s,P:0,W:0,D:0,L:0,GF:0,GA:0,form:[]}});
  played().forEach(function(m){var sc=score(m),h=sc[0],a=sc[1],H=T[m.home],A=T[m.away];if(!H||!A)return;
    H.P++;A.P++;H.GF+=h;H.GA+=a;A.GF+=a;A.GA+=h;
    if(h>a){H.W++;A.L++;H.form.push('W');A.form.push('L')}else if(h<a){A.W++;H.L++;A.form.push('W');H.form.push('L')}else{H.D++;A.D++;H.form.push('D');A.form.push('D')}});
  return Object.keys(T).map(function(k){var r=T[k];r.GD=r.GF-r.GA;r.Pts=r.W*3+r.D;return r})
    .sort(function(x,y){return y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF||x.s.name.localeCompare(y.s.name)});
}
/* everyone who has registered or played, merged by society and name */
function people(){
  var P={},order=[];
  function k(sid,name,x){var key=sid+'|'+(x?'x|':'')+nk(name);if(!P[key]){P[key]={soc:sid,name:clean(name,80),apps:0,g:0,a:0,motm:0,pos:[],cap:false,reg:0,here:0,ex:!!x};order.push(key)}return P[key]}
  var all=squads(),eids=Object.keys(all).sort(function(a,b){var x=evById(a),y=evById(b);return ((x&&x.date)||'').localeCompare((y&&y.date)||'')});
  eids.forEach(function(eid){Object.keys(all[eid]).forEach(function(sid){var q=all[eid][sid];(q.players||[]).forEach(function(p){var o=k(sid,full(p));o.name=full(p);o.reg++;posSort(p.pos).forEach(function(x){if(o.pos.indexOf(x)<0)o.pos.push(x)});o.cap=!!p.cap;if(q.here&&q.here[p.id])o.here++})})});
  played().forEach(function(m){var x=!!m.example;
    ['home','away'].forEach(function(sd){((m.lineups||{})[sd]||[]).forEach(function(n){k(sideSoc(m,sd),n,x).apps++})});
    (m.goals||[]).forEach(function(g){if(g.og)return;if(g.player)k(sideSoc(m,g.side),g.player,x).g++;if(g.assist)k(sideSoc(m,g.side),g.assist,x).a++});
    if(m.motm&&m.motm.player)k(sideSoc(m,m.motm.side),m.motm.player,x).motm++;
  });
  return order.map(function(x){var o=P[x];o.pos=posSort(o.pos);return o});
}
function formPills(f){var l=f.slice(-5);return l.length?'<span class="form" aria-label="Last '+l.length+' results">'+l.map(function(r){return '<i class="'+r+'" title="'+({W:'Win',D:'Draw',L:'Loss'})[r]+'">'+r+'</i>'}).join('')+'</span>':'<span class="mute">–</span>'}
function cleanSheets(){var c={};S.societies.forEach(function(s){c[s.id]=0});played().forEach(function(m){var sc=score(m);if(sc[1]===0&&c[m.home]!=null)c[m.home]++;if(sc[0]===0&&c[m.away]!=null)c[m.away]++});return c}

      squadL.map(function(p){return '<tr><td class="l"><span class="pn">'+esc(p.name)+(p.cap?'<span class="b cap" title="Captain">C</span>':'')+(p.ex?'<span class="tag ex">Example</span>':'')+'</span></td><td class="l">'+ppills(p.pos)+'</td><td>'+(p.here||'<span class="mute">0</span>')+'</td><td>'+p.apps+'</td><td class="pts">'+p.g+'</td><td>'+p.a+'</td><td>'+(p.motm||'<span class="mute">0</span>')+'</td></tr>'}).join('')+'</tbody></table></div><div class="foot">Squads come from sign-ups, matchday check-ins and teamsheets. Events counts the days a player checked in.</div>':'<p class="empty">No players yet. They’ll appear here once the society registers a squad.</p>')+'</section>'+
    '<section class="panel"><div class="panel-h"><h2>Matches</h2></div>'+(ms.length?grouped(ms,true):'<p class="empty">No matches yet.</p>')+'</section></div>';
}
function sqLabel(L){var ex=L.filter(function(p){return p.ex}).length,n=L.length-ex;return n+' player'+(n===1?'':'s')+(ex?' · '+ex+' example':'')}
function vMatch(id){
  var m=S.matches.find(function(x){return x.id===id});
  if(!m)return '<a class="back" href="#results">← All results</a><p class="empty">That match isn’t on record any more.</p>';
  var H=soc(m.home),A=soc(m.away),done=m.status==='played',sc=score(m),goals=(m.goals||[]).slice().sort(function(a,b){return (a.min==null?999:a.min)-(b.min==null?999:b.min)});
  function gl(side){var by={},order=[];goals.filter(function(g){return g.side===side}).forEach(function(g){var n=g.player+(g.og?' (OG)':'');if(!by[n]){by[n]=[];order.push(n)}by[n].push(g.min!=null?g.min+'′':'')});return order.map(function(n){return '<div>'+esc(n)+' '+by[n].filter(Boolean).join(', ')+'</div>'}).join('')}
  var hero='<section class="panel"><div class="hero"><div class="top">'+compTag(m)+'<span>'+fmtD(m.date)+(m.time?' · '+esc(m.time):'')+' · '+esc(mVenue(m))+'</span></div>'+
    '<div class="row"><div class="side">'+flag(H,'lg')+'<a href="#soc-'+esc(H.id)+'">'+esc(H.name)+'</a></div>'+
    (done?'<span class="score">'+sc[0]+'<span class="dash">–</span>'+sc[1]+'</span>':'<span class="score ko">'+esc(m.time||'TBC')+'</span>')+
    '<div class="side">'+flag(A,'lg')+'<a href="#soc-'+esc(A.id)+'">'+esc(A.name)+'</a></div></div>'+
    (done&&goals.length?'<div class="scorers"><div class="h">'+gl('home')+'</div><div class="mid"></div><div>'+gl('away')+'</div></div>':'')+'</div>';
  var an=m.anthem||{},cult=[];
  if(an.home)cult.push(['Anthem · '+H.code,an.home]);if(an.away)cult.push(['Anthem · '+A.code,an.away]);if(m.exchange)cult.push(['Exchange',m.exchange]);
  if(m.motm&&m.motm.player)cult.push(['Player of the match',m.motm.player+' ('+soc(sideSoc(m,m.motm.side)).code+')']);
  hero+=(cult.length?'<dl class="culture">'+cult.map(function(c){return '<div><dt>'+esc(c[0])+'</dt><dd>'+esc(c[1])+'</dd></div>'}).join('')+'</dl>':'')+'</section>';
  if(!done)return '<a class="back" href="#results">← All matches</a><div class="stack">'+hero+'<p class="note">Teamsheets, goals and the pre-match exchange will appear here after the game.</p></div>';
  var rh=0,ra=0;
  var tl='<section class="panel"><div class="panel-h"><h2>Goals</h2></div>'+(goals.length?'<ol class="tl">'+goals.map(function(g){if(g.side==='home')rh++;else ra++;
    var txt='<span class="gn">'+esc(g.player)+(g.og?' <span class="b">OG</span>':'')+' <span class="rs">'+rh+'–'+ra+'</span></span>'+(g.assist&&!g.og?'<span class="as">Assist: '+esc(g.assist)+'</span>':'');
    return '<li><span class="h">'+(g.side==='home'?txt:'')+'</span><span class="mn">'+(g.min!=null?g.min+'′':'–')+'</span><span class="a">'+(g.side==='away'?txt:'')+'</span></li>'}).join('')+'</ol>':'<p class="empty">Goalless.</p>')+'</section>';
  function sheet(side){
    var lu=(m.lineups||{})[side]||[],s=soc(sideSoc(m,side)),gs=m.goals||[];
    function li(n){var G=gs.filter(function(g){return g.side===side&&!g.og&&g.player===n}).length,As=gs.filter(function(g){return g.side===side&&!g.og&&g.assist===n}).length,O=gs.filter(function(g){return g.og&&g.side===other(side)&&g.player===n}).length,b=[];
      if(G)b.push('<span class="b" title="Goals">'+G+' G</span>');if(As)b.push('<span class="b" title="Assists">'+As+' A</span>');if(O)b.push('<span class="b" title="Own goal">OG</span>');
      if(m.motm&&m.motm.side===side&&m.motm.player===n)b.push('<span class="b motm">POTM</span>');
      return '<li><span>'+esc(n)+'</span><span class="bs">'+b.join('')+'</span></li>'}
    return '<div class="sheet"><h3>'+flag(s)+esc(s.name)+'</h3>'+(lu.length?'<div class="lbl">Starting VII</div><ul>'+lu.slice(0,7).map(li).join('')+'</ul>'+(lu.length>7?'<div class="lbl">Subs</div><ul>'+lu.slice(7).map(li).join('')+'</ul>':''):'<p class="hint">No teamsheet recorded.</p>')+'</div>';
  }
  var sheets='<section class="panel"><div class="panel-h"><h2>Teamsheets</h2></div><div class="sheets">'+sheet('home')+sheet('away')+'</div></section>';
  return '<a class="back" href="#results">← All results</a><div class="stack">'+hero+tl+sheets+'</div>';
}

/* ---------- squad sign-up ---------- */
function blankP(){return {first:'',last:'',pos:[],cap:false}}
function blankRows(n){var a=[];for(var i=0;i<n;i++)a.push(blankP());return a}
function newReg(){return {mode:'new',step:'form',event:'',soc:'',newsoc:'',players:blankRows(NEED),loaded:false,show:false}}
function fromDraft(d){
  if(!d||d.v!==1||!Array.isArray(d.players))return null;
  var r=newReg();r.event=typeof d.event==='string'?d.event:'';r.soc=typeof d.soc==='string'?d.soc:'';r.newsoc=String(d.newsoc||'').slice(0,40);r.loaded=!!d.loaded;
  r.players=d.players.slice(0,MAXP).map(function(p){p=p||{};return {first:String(p.first||'').slice(0,40),last:String(p.last||'').slice(0,40),pos:posSort(p.pos),cap:!!p.cap}});
  if(!r.players.length)r.players=blankRows(NEED);
  return r;
}
function ensureReg(){if(!REG)REG=fromDraft(sGet('l',REG_KEY))||newReg();return REG}
var rdT=null;
function saveRegDraft(){clearTimeout(rdT);rdT=setTimeout(function(){if(REG&&REG.mode!=='edit')sSet('l',REG_KEY,{v:1,event:REG.event,soc:REG.soc,newsoc:REG.newsoc,loaded:REG.loaded,players:REG.players.map(function(p){return {first:p.first,last:p.last,pos:p.pos,cap:p.cap}})})},250)}
function regMode(R){return R.mode==='edit'?'edit':(CAN?'org':'public')}
function regEvents(){var t=todayStr();return events().filter(function(e){return e.date>=t&&(CAN||regOpen(e))}).sort(function(a,b){return a.date.localeCompare(b.date)})}
function rowBlank(p){return !clean(p.first)&&!clean(p.last)&&!p.pos.length&&!p.cap}
function cleanPlayers(R){return R.players.filter(function(p){return !rowBlank(p)}).map(function(p){var o={first:clean(p.first),last:clean(p.last),pos:posSort(p.pos),cap:!!p.cap};if(p.id)o.id=p.id;return o})}
function countTxt(R){var n=R.players.filter(function(p){return !rowBlank(p)}).length;return n+' player'+(n===1?'':'s')+' · '+(n>=NEED?'enough to start a match':(NEED-n)+' more to start a match')}
function rowErr(R,i,seen){
  var p=R.players[i];if(!p||rowBlank(p))return null;
  var miss=[];if(!clean(p.first))miss.push('first name');if(!clean(p.last))miss.push('last name');
  if(miss.length)return {t:'Enter a '+miss.join(' and ')+' for player '+(i+1)+'.',f:'rp'+i+'-'+(clean(p.first)?'last':'first')};
  if(!p.pos.length)return {t:'Tick at least one position for player '+(i+1)+'.',f:'rp'+i+'-GK'};
  if(seen){var k=nk(full(p));if(seen[k]!=null)return {t:'Player '+(i+1)+' is already listed as player '+(seen[k]+1)+'.',f:'rp'+i+'-first'};seen[k]=i}
  return null;
}
function regErrors(R){
  var e={list:[],rows:{},soc:''},seen={},count=0;
  if(R.mode!=='edit'){
    if(!R.soc)e.soc='Choose the society you’re representing.';
    else if(R.soc==='__new'&&clean(R.newsoc).length<2)e.soc='Enter your society’s name.';
    if(e.soc)e.list.push({t:e.soc,f:R.soc==='__new'?'r-newsoc':'r-soc'});
  }
  R.players.forEach(function(p,i){if(rowBlank(p))return;count++;var x=rowErr(R,i,seen);if(x){e.rows[i]=x.t;e.list.push(x)}});
  if(!count)e.list.push({t:'Add at least one player.',f:'rp0-first'});
  return e;
}
function regHead(ev,kick,title){
  var d=new Date(ev.date+'T12:00:00');
  return '<div class="ev-head"><div class="ev-date" aria-hidden="true"><span>'+esc(d.toLocaleDateString('en-GB',{weekday:'short'}))+'</span><b>'+d.getDate()+'</b><span>'+esc(d.toLocaleDateString('en-GB',{month:'short'}))+'</span></div>'+
    '<div class="ev-info"><div class="ev-kick">'+esc(kick)+'</div><h2>'+esc(title)+'</h2><div class="ev-meta"><span>'+esc(ev.name)+'</span><span>'+esc(ev.time||'Times TBC')+'</span><span>'+esc(ev.venue||'Venue TBC')+'</span></div>'+
    (ev.close?'<p class="ev-note">'+(regOpen(ev)?'Sign-ups close '+fmtShort(ev.close):'Sign-ups have closed')+'</p>':'')+'</div></div>';

function vRegister(){
  var R=ensureReg();
  if(R.mode==='edit'&&!CAN){REG=null;R=ensureReg()}
  if(R.soc&&R.soc!=='__new'&&!S.societies.some(function(s){return s.id===R.soc}))R.soc='';
  var mode=regMode(R),ev=null;
  if(mode==='edit')ev=evById(R.event)||null;
  else{var evs=regEvents();ev=evs.find(function(e){return e.id===R.event})||evs[0]||null;R.event=ev?ev.id:''}
  if(ev&&mode!=='edit'&&!ev.openSignup&&R.soc&&(ev.societies||[]).indexOf(R.soc)<0)R.soc='';
  if(!ev){
    var t=todayStr(),closed=events().filter(function(e){return e.date>=t&&!regOpen(e)}).sort(function(a,b){return a.date.localeCompare(b.date)})[0];
    return '<div class="stack"><section class="panel"><div class="panel-h"><h2>Register your squad</h2></div><p class="empty">'+(closed?'Squad sign-ups for '+esc(closed.name)+' closed on '+fmtShort(closed.close)+'. Message <a href="'+IG+'" target="_blank" rel="noopener">@ic_worldcup</a> on Instagram if you need to make a change.':'There’s no event open for squad sign-ups right now. Check back when the next one is announced.')+'</p></section></div>';
  }
  return R.step==='sent'?regSent(R,ev):R.step==='review'?regReview(R,ev,mode):regForm(R,ev,mode);
}
function plRow(p,i,errs){
  var pe=errs&&errs.rows[i],n=i+1;
  return '<li class="pl'+(pe?' bad':'')+'" id="pl'+i+'"><fieldset><legend>Player '+n+'</legend>'+
    '<button type="button" class="pl-rm" data-act="r-del" data-i="'+i+'" aria-label="Remove player '+n+'">Remove</button>'+
    '<div class="pl-names"><label>First name<input id="rp'+i+'-first" data-rp="first" data-i="'+i+'" value="'+esc(p.first)+'" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next"></label>'+
    '<label>Last name<input id="rp'+i+'-last" data-rp="last" data-i="'+i+'" value="'+esc(p.last)+'" maxlength="40" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next"></label></div>'+
    '<div class="pl-tags" role="group" aria-label="Positions for player '+n+'">'+POS.map(function(x){var on=p.pos.indexOf(x)>=0;return '<label class="pchip'+(on?' on':'')+'" title="'+POSN[x]+'"><input type="checkbox" id="rp'+i+'-'+x+'" data-rpos="'+x+'" data-i="'+i+'"'+(on?' checked':'')+'>'+x+'</label>'}).join('')+
    '<label class="pchip cap'+(p.cap?' on':'')+'"><input type="checkbox" id="rp'+i+'-cap" data-rcap="1" data-i="'+i+'"'+(p.cap?' checked':'')+'>Captain</label></div>'+
    (pe?'<p class="perr">'+esc(pe)+'</p>':'')+'</fieldset></li>';
}
function regForm(R,ev,mode){
  var errs=R.show?regErrors(R):null,evs=mode==='edit'?[]:regEvents();
  var inEv=evSocs(ev),openReg=!!ev.openSignup,others=openReg?S.societies.filter(function(s){return inEv.indexOf(s)<0}):[];
  var cur=R.soc&&R.soc!=='__new'&&mode!=='edit'?squad(ev.id,R.soc):null;

  var intro=mode==='public'?'<p class="lede">List everyone who might play for your society on the day. Next you’ll check the list and send it to the organisers. Names and positions are shown publicly on this site.</p>':
    mode==='org'?'<p class="note"><span>You’re an organiser, so squads you enter here go straight onto the site.</span></p>':

  var who=mode==='edit'?'<div class="rv-team">'+flag(soc(R.soc),'md')+'<div><b>'+esc(soc(R.soc).full||soc(R.soc).name)+'</b><span class="eyebrow">'+esc(ev.name)+' · '+fmtShort(ev.date)+'</span></div></div>':
    (evs.length>1?'<label>Event<select id="r-event" data-r="event">'+opts(evs.map(function(e){return [e.id,e.name+' · '+fmtShort(e.date)]}),R.event)+'</select></label>':'')+
    '<label>Society you’re representing<select id="r-soc" data-r="soc"><option value="">Choose your society</option>'+
    (openReg?(inEv.length?'<optgroup label="Taking part in '+esc(ev.name)+'">'+inEv.map(o).join('')+'</optgroup>':'')+
    (others.length?'<optgroup label="Other societies">'+others.map(o).join('')+'</optgroup>':'')+
    '<option value="__new"'+(R.soc==='__new'?' selected':'')+'>My society isn’t listed</option>':inEv.slice().sort(function(a,b){return (a.full||a.name).localeCompare(b.full||b.name)}).map(o).join(''))+'</select></label>'+
    (openReg?'':'<p class="hint" style="margin:-6px 0 0">Only the '+inEv.length+' teams playing in '+esc(ev.name)+' can register. Not on the list? Message <a href="'+IG+'" target="_blank" rel="noopener">@ic_worldcup</a>.</p>')+
    (R.soc==='__new'?'<label>Society name<input id="r-newsoc" data-r="newsoc" value="'+esc(R.newsoc)+'" maxlength="40" placeholder="e.g. Polish Society" autocapitalize="words"></label>':'')+
    (errs&&errs.soc?'<p class="perr" style="margin:0">'+esc(errs.soc)+'</p>':'');
  var loadNote=cur&&cur.players.length&&!R.loaded?'<div class="note"><span>'+cur.players.length+' player'+(cur.players.length===1?' is':'s are')+' already registered for '+esc(soc(R.soc).name)+'. To change the squad, start from that list.</span><button type="button" class="btn sm" data-act="r-load">Start from current squad</button></div>':'';
  var full15=R.players.length>=MAXP;
  return '<div class="stack"><section class="panel reg">'+regHead(ev,mode==='public'?'Squad sign-up':'Organiser',mode==='edit'?'Edit squad':'Register your squad')+
    '<div class="ed reg-body">'+intro+
    (errs&&errs.list.length?'<div class="errsum" id="errsum" role="alert" tabindex="-1"><h3>Fix '+(errs.list.length===1?'this':'these')+' to continue</h3><ul>'+errs.list.map(function(x){return '<li><button type="button" data-act="r-focus" data-f="'+esc(x.f)+'">'+esc(x.t)+'</button></li>'}).join('')+'</ul></div>':'')+
    who+loadNote+
    '<div class="sub-row" style="margin-top:6px"><h3 class="sub-h">Players</h3><span class="count" id="r-count" aria-live="polite">'+countTxt(R)+'</span></div>'+
    '<p class="hint" style="margin:-6px 0 0">Tick every position each player can play. Leave spare rows empty, they’re ignored.</p>'+

    '<div class="addrow"><button type="button" class="btn" data-act="r-add"'+(full15?' disabled':'')+'>Add another player</button>'+(full15?'<span class="hint">'+MAXP+' players is the maximum.</span>':'')+'</div>'+
    '<div class="acts reg-acts"><button type="button" class="btn pri" data-act="r-review">'+(mode==='edit'?'Review changes':'Review squad')+'</button>'+

}
function regTeam(R){return R.soc==='__new'?{name:clean(R.newsoc),full:clean(R.newsoc),flag:''}:soc(R.soc)}
function encodeSig(R,ev,ps){return 'ICWC1.'+b64e(JSON.stringify({v:1,e:ev.id,s:R.soc==='__new'?'':R.soc,n:R.soc==='__new'?clean(R.newsoc):'',r:R.loaded?1:0,p:ps.map(function(p){return [p.first,p.last,mask(p.pos),p.cap?1:0]})}))+'.'}
function regMessage(R,ev,ps){
  var s=regTeam(R),L=['IC World Cup squad sign-up',ev.name+' · '+fmtShort(ev.date),s.full||s.name,''];
  ps.forEach(function(p,i){L.push((i+1)+'. '+full(p)+(p.cap?' (C)':'')+' · '+posSort(p.pos).join(', '))});
  L.push('',ps.length+' player'+(ps.length===1?'':'s'),'','Code: '+encodeSig(R,ev,ps));

}
function regReview(R,ev,mode){
  var ps=cleanPlayers(R),s=regTeam(R),short=ps.length<NEED;
  var list='<ol class="rv-list">'+ps.map(function(p,i){return '<li><span class="rv-n"><span class="rv-i">'+(i+1)+'</span><span class="pn">'+esc(full(p))+(p.cap?'<span class="b cap" title="Captain">C</span>':'')+'</span></span>'+ppills(p.pos)+'</li>'}).join('')+'</ol>';

      '<p>Your squad isn’t registered until the organisers have it. Send it on WhatsApp to your contact on the committee, or copy it into a DM to <a href="'+IG+'" target="_blank" rel="noopener">@ic_worldcup</a> on Instagram.</p>'+
      '<div class="acts"><a class="btn pri" href="'+esc('https://wa.me/?text='+encodeURIComponent(msg))+'" target="_blank" rel="noopener">Send on WhatsApp</a><button type="button" class="btn" data-act="r-copy">Copy message</button></div>'+
      '<p class="hint">Once it’s added, your players show on the '+esc(s.name)+' page. To change anything later, edit the list and send it again.</p>'+

  }else actions='<div class="acts reg-acts"><button type="button" class="btn pri" data-act="r-save"'+(BUSY?' disabled':'')+'>'+(mode==='edit'?'Save squad':'Add to website')+'</button><button type="button" class="btn" data-act="r-edit">Edit squad</button></div>';
  return '<div class="stack"><section class="panel reg">'+regHead(ev,mode==='public'?'Squad sign-up':'Organiser','Check your squad')+'<div class="reg-body">'+
    '<div class="rv-team">'+flag(s,'md')+'<div><b>'+esc(s.full||s.name)+'</b><span class="eyebrow">'+ps.length+' player'+(ps.length===1?'':'s')+'</span></div>'+(mode==='public'?'<button type="button" class="btn sm" data-act="r-edit">Edit</button>':'')+'</div>'+
    (short?'<p class="note warnline"><span>That’s '+ps.length+' player'+(ps.length===1?'':'s')+'. A team needs '+NEED+' to start a match. You can '+(mode==='public'?'send':'save')+' it now and add more later.</span></p>':'')+
    list+actions+'</div></section></div>';
}
function saveReg(){
  var R=REG,mode=regMode(R),ev=evById(R.event);if(!ev||mode==='public')return;
  var ps=cleanPlayers(R),sid=R.soc,newId=null,name='';
  if(sid==='__new'){name=clean(R.newsoc);var ex=findSocByName(name);if(ex)sid=ex.id;else{newId=uid('s');sid=newId}}
  var sname=newId?name.replace(/\s+society$/i,''):soc(sid).name;
  commit(function(){if(newId)createSociety(name,newId);applySquad(ev.id,sid,ps,mode==='edit'?'hard':(R.loaded?'soft':'none'))},

  c.exchange=c.exchange||'';c.lineups=c.lineups||{home:[],away:[]};c.lineups.home=c.lineups.home||[];c.lineups.away=c.lineups.away||[];
  c.goals=(c.goals||[]).map(function(g){return {side:g.side,player:g.player||'',min:g.min==null?'':g.min,assist:g.assist||'',og:!!g.og}});c.motm=c.motm||null;c.time=c.time||'';c.venue=c.venue||'';

function saveMatch(){
  var e=ED,err=document.getElementById('ed-err');function fail(t){err.textContent=t}
  if(!e.date)return fail('Add the match date.');
  if(!e.home||!e.away)return fail('Choose both societies.');
  if(e.home===e.away)return fail('A society can’t play itself. Pick two different societies.');
  if(e.status==='played'&&e.goals.some(function(g){return !g.player}))return fail('Every goal needs a player. Pick one or remove that goal.');
  var c={id:e.id,date:e.date,time:e.time||'',home:e.home,away:e.away,comp:e.comp||'Friendly',status:e.status,venue:(e.venue||'').trim()};
  if(e.example)c.example=true;
  if(e.status==='played'){
    c.anthem={home:e.anthem.home.trim(),away:e.anthem.away.trim()};c.exchange=e.exchange.trim();c.lineups={home:e.lineups.home.slice(),away:e.lineups.away.slice()};
    c.goals=e.goals.map(function(g){return {side:g.side,player:g.player,min:g.min===''?null:+g.min,assist:g.og?'':g.assist,og:!!g.og}});
    c.motm=e.motm&&e.motm.player?e.motm:null;
  }
  commit(function(){var i=S.matches.findIndex(function(m){return m.id===c.id});if(i>=0)S.matches[i]=c;else S.matches.push(c)},'Match saved',function(){ED=null});
}
function saveSoc(){
  var e=SED,err=document.getElementById('soc-err');function fail(t){err.textContent=t}
  var name=(e.name||'').trim(),code=(e.code||'').trim().toUpperCase();
  if(!name)return fail('Add a short name, like “Hungarian”.');
  if(!/^[A-Z]{2,4}$/.test(code))return fail('Use a 2 to 4 letter code, like HUN.');
  if(S.societies.some(function(s){return s.code===code&&s.id!==e.id}))return fail(code+' is already used by another society.');
  var c={id:e.id||uid('s'),name:name,full:(e.full||'').trim()||name+' Society',code:code,flag:okFlag(e.flag)?e.flag:''};
  commit(function(){var i=S.societies.findIndex(function(s){return s.id===c.id});if(i>=0)S.societies[i]=c;else S.societies.push(c)},'Society saved',function(){SED=null});

/* ---------- matchday check-in ---------- */
function mdKey(eid,sid){return 'icwc-md:'+eid+':'+sid}
function hereSorted(h){var o={};Object.keys(h||{}).sort().forEach(function(k){o[k]=h[k]});return o}
function mdSnap(d){return JSON.stringify({p:d.players,h:hereSorted(d.here)})}
function mdSaved(eid,sid){var q=squad(eid,sid);return {players:q?JSON.parse(JSON.stringify(q.players||[])):[],here:q&&q.here?JSON.parse(JSON.stringify(q.here)):{}}}
function mdDraft(eid,sid){
  var d=sGet('l',mdKey(eid,sid)),sv=mdSaved(eid,sid);
  if(d&&Array.isArray(d.players)&&d.here&&typeof d.here==='object'){
    d.players=d.players.filter(function(p){return p&&typeof p.id==='string'});
    if(mdSnap(d)===mdSnap(sv)){sDel('l',mdKey(eid,sid));return {d:sv,dirty:false}}
    return {d:d,dirty:true};
  }
  return {d:sv,dirty:false};
}
function mdPut(eid,sid,d){if(mdSnap(d)===mdSnap(mdSaved(eid,sid)))sDel('l',mdKey(eid,sid));else sSet('l',mdKey(eid,sid),d)}
function mdEvents(){return events().slice().sort(function(a,b){return a.date.localeCompare(b.date)})}
function mdDefault(){var L=mdEvents(),t=todayStr();return L.find(function(e){return e.date===t})||L.find(function(e){return e.date>t})||L[L.length-1]||null}
function mdSocs(ev){var ids=(ev.societies||[]).slice();Object.keys(squads()[ev.id]||{}).forEach(function(x){if(ids.indexOf(x)<0)ids.push(x)});return ids.map(function(id){return S.societies.find(function(s){return s.id===id})}).filter(Boolean)}

function mdTeam(ev,sid){

  return '<button type="button" class="back" data-act="md-back">← All teams</button><div class="stack"><section class="panel">'+
    '<div class="md-head">'+flag(s,'lg')+'<div class="grow1"><h2>'+esc(s.full||s.name)+'</h2><div class="eyebrow">'+esc(ev.name)+' · '+fmtShort(ev.date)+'</div></div></div>'+

/* ---------- live data (Firebase) ---------- */
var FBV='10.12.2';
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({code:'timeout'})},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
function loadFirebase(cfg){
  var B='https://www.gstatic.com/firebasejs/'+FBV+'/';
  return Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]).then(function(m){
    var A=m[0],F=m[1],U=m[2],app=A.initializeApp(cfg),db=F.getFirestore(app),auth=U.getAuth(app);
    var stateRef=F.doc(db,'site','state'),adminsRef=F.doc(db,'config','admins'),col=F.collection(db,'signups');
    return {
      onState:function(cb,err){return F.onSnapshot(stateRef,function(s){if(!s.exists()&&s.metadata.fromCache)return;/* 'no data' from the offline cache isn't a real answer, so keep waiting */var d=s.exists()?s.data():null;cb(d&&d.json?JSON.parse(d.json):null)},err)},
      transactState:function(fn){return F.runTransaction(db,function(tx){return tx.get(stateRef).then(function(s){var d=s.exists()?s.data():null,next=fn(d&&d.json?JSON.parse(d.json):null);tx.set(stateRef,{json:JSON.stringify(next),at:F.serverTimestamp(),by:(auth.currentUser&&auth.currentUser.email)||''})})})},
      onAuth:function(cb){return U.onAuthStateChanged(auth,function(u){cb(u?{email:String(u.email||'').toLowerCase(),name:u.displayName||u.email||''}:null)})},
      signIn:function(){var p=new U.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return U.signInWithPopup(auth,p)},
      signOut:function(){return U.signOut(auth)},
      isAdmin:function(){return F.getDoc(adminsRef).then(function(){return true},function(){return false})},
      submitSignup:function(o){var d={};for(var k in o)d[k]=o[k];d.at=F.serverTimestamp();return withTimeout(F.addDoc(col,d),15000)},
      onSignups:function(cb,err){return F.onSnapshot(F.query(col,F.orderBy('at')),function(q){cb(q.docs.map(function(x){var d=x.data();d.id=x.id;return d}))},err)},
      deleteSignup:function(id){return F.deleteDoc(F.doc(db,'signups',id))},
      getAdmins:function(){return F.getDoc(adminsRef).then(function(s){var d=s.exists()?s.data():null;return d&&Array.isArray(d.emails)?d.emails.slice():[]})},
      setAdmins:function(list){return F.setDoc(adminsRef,{emails:list})}
    };
  });
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function typing(){var a=document.activeElement;return !!(a&&root.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox')}
/* live updates re-draw the page, but never while someone is typing in a field */
function liveRender(){if(typing()){pendingRender=true;return}pendingRender=false;render()}
root.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!typing()){pendingRender=false;render()}},60)});
function useSeed(msg){if(S&&LOADED)return;S=clone(SEED);LOADED=true;NOTICE=msg;render()}
var inboxOff=null;
function startInbox(){stopInbox();inboxOff=FB.onSignups(function(list){PENDING=list;liveRender()},function(){PENDING=[];liveRender()})}
function stopInbox(){if(inboxOff){try{inboxOff()}catch(e){}inboxOff=null}PENDING=[]}
function start(){
  var timer=setTimeout(function(){if(!LOADED)useSeed('Live data is taking a while, so this is a saved copy of the site for now.')},12000);
  FB.onState(function(st){clearTimeout(timer);LOADED=true;NOTICE='';SERVER=st;S=st?clone(st):null;liveRender()},
    function(){clearTimeout(timer);useSeed('Live data couldn’t load, so this is a saved copy of the site. Try refreshing in a minute.')});
  FB.onAuth(function(u){USER=u;ADMINS=null;stopInbox();if(!u){CAN=false;render();return}
    FB.isAdmin().then(function(ok){if(USER!==u)return;CAN=ok;if(ok)startInbox();render()})});
}
function boot(){
  if(window.__ICWC_FB_MOCK__){FB=window.__ICWC_FB_MOCK__;start();return}
  var cfg=window.ICWC_FIREBASE;
  if(!cfg||!cfg.apiKey||!cfg.projectId||/PASTE/i.test(cfg.apiKey)){LOCAL=true;S=clone(SEED);LOADED=true;NOTICE='Preview copy: this site isn’t connected to its database yet, so it shows saved data and nothing can be changed.';render();return}
  loadFirebase(cfg).then(function(fb){FB=fb;start()},function(){useSeed('Live data couldn’t load, so this is a saved copy of the site. Try refreshing in a minute.')});
}

/* ---------- saving ---------- */
function goHash(h){if(h&&location.hash!==h){location.hash=h;return true}return false}
function commit(mutate,msg,after,nextHash){
  if(BUSY)return;PEND=null;
  if(!FB){mutate();if(after)after();if(!goHash(nextHash))render();toast(msg+' (preview only)');return}
  BUSY=true;render();toast('Saving…',true);
  /* the change is re-applied to the newest copy of the data, so two organisers saving at once don't overwrite each other */
  FB.transactState(function(cur){S=cur?cur:clone(SEED);mutate();return S}).then(function(){
    BUSY=false;if(after)after();toast(msg);if(!goHash(nextHash))render();
  }).catch(function(err){
    BUSY=false;S=SERVER?clone(SERVER):S;var c=String(err&&err.code||'');
    if(/permission/.test(c))toast('This account can’t save changes. Sign in with an organiser account.');
    else if(/unavailable|network|offline|failed-precondition/.test(c))toast('You look offline, so that didn’t save. Check your connection and try again.');
    else toast('Saving didn’t go through. Try again in a moment.');
    render();
  });
}
var tt;
function toast(t,stay){var el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(tt);if(!stay)tt=setTimeout(function(){el.hidden=true},4200)}
function copyText(text,okMsg,fallbackEl){
  function fb(){
    if(fallbackEl){if(fallbackEl.tagName==='TEXTAREA'){var dt=fallbackEl.closest('details');if(dt)dt.open=true;fallbackEl.focus();fallbackEl.select()}
      else{try{var r=document.createRange();r.selectNodeContents(fallbackEl);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}catch(e){}}}

function onField(ev){
  var t=ev.target,ds=t.dataset;
  if(ds.sf&&SED){SED[ds.sf]=t.value;if(ds.sf==='flag'){var fp=document.getElementById('s-flag-prev');if(fp)fp.innerHTML=flag(SED,'md')}return}
  if(ds.ef&&EVD){EVD[ds.ef]=t.type==='checkbox'?t.checked:t.value;return}
  if(ds.evs&&EVD){var sid=ds.evs,k=EVD.societies.indexOf(sid);if(t.checked&&k<0)EVD.societies.push(sid);else if(!t.checked&&k>=0)EVD.societies.splice(k,1);return}
  /* squad sign-up */
  if(ds.r&&REG){var key=ds.r;if(key==='newsoc'){REG.newsoc=t.value;saveRegDraft();return}if(REG[key]!==t.value){REG[key]=t.value;if(key==='soc'||key==='event')REG.loaded=false;saveRegDraft();render()}return}
  if(ds.rp!=null&&REG){var p=REG.players[+ds.i];if(!p)return;p[ds.rp]=t.value;saveRegDraft();regLive(+ds.i);return}
  if(ds.rpos&&REG){var p2=REG.players[+ds.i];if(!p2)return;var has1=p2.pos.indexOf(ds.rpos)>=0;if(t.checked&&!has1)p2.pos=posSort(p2.pos.concat([ds.rpos]));else if(!t.checked&&has1)p2.pos=p2.pos.filter(function(x){return x!==ds.rpos});t.parentNode.classList.toggle('on',t.checked);saveRegDraft();regLive(+ds.i);return}
  if(ds.rcap&&REG){var i3=+ds.i,p3=REG.players[i3];if(!p3)return;p3.cap=t.checked;t.parentNode.classList.toggle('on',t.checked);
    if(t.checked)REG.players.forEach(function(o,j){if(j!==i3&&o.cap){o.cap=false;var inp=document.getElementById('rp'+j+'-cap');if(inp){inp.checked=false;inp.parentNode.classList.remove('on')}}});
    saveRegDraft();regLive(i3);return}
  /* admin import */
  if(ds.imp){IMP=IMP||{text:'',items:null,msg:''};IMP.text=t.value;return}
  if(ds.imprm!=null&&IMP&&IMP.items){var it=IMP.items[+ds.imprm];if(it&&it.rm!==t.checked){it.rm=t.checked;render()}return}
  if(ds.inrm!=null){INRM[ds.inrm]=t.checked;render();return}
  /* matchday */
  if(ds.md==='event'){if(MD.event!==t.value){MD.event=t.value;MD.team='';MD.d=null;MD.dFor='';MD.add=null;sSet('s','icwc-md-ev',MD.event);render()}return}
  if(ds.ma&&MD.add){MD.add[ds.ma]=t.value;return}
  if(ds.mapos&&MD.add){var A=MD.add,h=A.pos.indexOf(ds.mapos)>=0;if(t.checked&&!h)A.pos=posSort(A.pos.concat([ds.mapos]));else if(!t.checked&&h)A.pos=A.pos.filter(function(x){return x!==ds.mapos});t.parentNode.classList.toggle('on',t.checked);return}
  if(!ED)return;
  if(ds.f){var f=ds.f;if(f.indexOf('anthem.')===0)ED.anthem[f.slice(7)]=t.value;else ED[f]=t.value;if(ds.rr&&ev.type==='change')render();return}
  if(ds.lu){ED.lineups[ds.lu]=t.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);if(ev.type==='change')refreshGoals();return}
  if(ds.g!=null){var g=ED.goals[+ds.g],k2=ds.k;if(!g)return;
    if(k2==='og'){if(g.og===t.checked)return;g.og=t.checked;g.player='';g.assist=''}
    else if(k2==='side'){if(g.side===t.value)return;g.side=t.value;g.player='';g.assist=''}
    else if(k2==='min'){g.min=t.value===''?'':Math.max(0,Math.min(120,parseInt(t.value,10)||0));updScore();return}
    else g[k2]=t.value;
    if(ev.type==='change')refreshGoals();else updScore();return}
  if(ds.motm){var v=t.value,i=v.indexOf('|');ED.motm=v?{side:v.slice(0,i),player:v.slice(i+1)}:null}
}

function render(){
  var h=(location.hash||'').slice(1)||'results',active=h,body;
  if(!S){
    if(!LOADED)body='<div class="stack"><section class="panel"><p class="empty" role="status">Loading…</p></section></div>';
    else if(CAN)body=setupView();
    else if(h==='admin'||h==='matchday')body=signInView();
    else body='<div class="stack"><section class="panel"><div class="panel-h"><h2>Coming soon</h2></div><p class="empty">The site is being set up. Check back soon.</p></section></div>';
    root.innerHTML=shell(h==='admin'||h==='matchday'?h:'',body);tabsFit();return;
  }
  if(h.indexOf('match-')===0){body=vMatch(h.slice(6));active='results'}
  else if(h.indexOf('soc-')===0){body=vSoc(h.slice(4));active='societies'}
  else if(h==='table')body=vTable();
  else if(h==='stats')body=vStats();
  else if(h==='societies')body=vSocieties();
  else if(h==='register'){body=vRegister();active=''}
  else if(h==='matchday')body=CAN?vMatchday():signInView();
  else if(h==='admin')body=CAN?vAdmin():signInView();
  else{body=vResults();active='results'}
  root.innerHTML=shell(active,body);
  tabsFit();
}
/* on narrow screens the tab bar scrolls: keep the current tab in view and fade the edge while more tabs are off-screen */
function tabsFit(){
  var nav=root.querySelector('nav.tabs');if(!nav)return;
  var cur=nav.querySelector('[aria-current]');
  if(cur&&nav.scrollWidth>nav.clientWidth){var cr=cur.getBoundingClientRect(),nr=nav.getBoundingClientRect();if(cr.right>nr.right||cr.left<nr.left)nav.scrollLeft=Math.max(0,cr.left-nr.left+nav.scrollLeft-12)}
  function upd(){nav.classList.toggle('more',nav.scrollLeft+nav.clientWidth<nav.scrollWidth-4)}
  upd();nav.addEventListener('scroll',upd,{passive:true});
}
